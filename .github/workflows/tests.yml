name: Tests

# Runs on pull requests and on pushes to develop only; never on a schedule,
# so it cannot interfere with the forward-mode cron workflow.
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.11: processing machine env (environment.yml); 3.12: coseis-cron.yml
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same packages as coseis-cron.yml, so a new import that the cron workflow
          # would lack also fails here (next_pass is faked in the tests)
          pip install asf_search beautifulsoup4 python-dateutil requests folium geojson geopandas lxml premailer shapely tabulate yagmail
          # Historic mode's frame map (GeoDataFrame.explore) also needs these
          pip install matplotlib mapclassify
          pip install -r requirements-test.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check src tests scripts/coseis.py
          ruff format --check src tests scripts/coseis.py

      - name: Run tests (HTTP replayed from cassettes; network requests not in a cassette fail)
        run: pytest -q
