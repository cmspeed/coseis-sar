name: COSEIS Forward Email Notifications

on:
  schedule:
    # Minutes 0 and 50 of every hour
    - cron: '*/50 * * * *'
  workflow_dispatch:

jobs:
  run-coseis-notifications:
    runs-on: ubuntu-latest
    
    timeout-minutes: 45 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # aria_coseis and its core dependencies, plus next_pass (forward extra)
          pip install -e ".[forward]"

      - name: Run COSEIS Forward Script (Email Only)
        env:
          COSEIS_PRIMARY_RECIPIENTS: ${{ secrets.COSEIS_PRIMARY_RECIPIENTS }}
          COSEIS_SECONDARY_RECIPIENTS: ${{ secrets.COSEIS_SECONDARY_RECIPIENTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PSWD: ${{ secrets.GMAIL_APP_PSWD }}
        run: python -m aria_coseis --forward --pairing coseismic --send_email

      - name: Save Tracking State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the tracker (additions, edits and deletions, including active_jobs/partials/) and new maps
          git add -A active_jobs/ || true
          git add docs/maps/*.html || true
          
          # Commit if anything changed, then push. If the processing machine pushed in between,
          # rebase onto it and retry; fail the run visibly if the push never succeeds.
          if ! git diff --cached --quiet; then
            git commit -m "Update COSEIS tracking state and add new maps [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2> /dev/null || true
              echo "Push attempt $attempt failed; retrying in 30 s."
              sleep 30
            done
            echo "::error::Could not push tracker changes after 3 attempts."
            exit 1
          else
            echo "No changes to commit. Skipping."
          fi