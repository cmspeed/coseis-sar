name: coseis-sar
channels:
  - conda-forge
dependencies:
  - python=3.11
  - asf_search
  - bs4
  - python-dateutil
  - requests
  - folium
  - geojson
  - geopandas
  - lxml
  - premailer
  - shapely
  - tabulate
  - yagmail
  - matplotlib   # historic frame map (GeoDataFrame.explore)
  - mapclassify
  # Optical (--sensor sentinel-2/landsat); imported lazily, not needed for SAR-only runs
  - earthengine-api
  - google-cloud-storage
  - pystac-client
  - gdal
  # scripts/batch_autorift.py additionally requires hyp3_autorift
  - pip
  - pip:
      - git+https://github.com/OPERA-Cal-Val/next_pass.git
